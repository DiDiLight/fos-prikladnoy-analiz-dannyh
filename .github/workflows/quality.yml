name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Validate KRM, documentation, FOS, links, and office attachments
        run: python scripts/validate_repository.py
      - name: Install locked teaching environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip check
      - name: Generate small case, run baseline, and guard leakage
        run: python scripts/smoke_test.py
      - name: Run reproducibility tests
        run: python -m unittest discover -s examples/synthetic-case/tests -v
