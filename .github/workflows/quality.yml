name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python scripts/validate_repository.py
      - name: Install synthetic case dependencies
        run: python -m pip install -r examples/synthetic-case/requirements-test.txt
      - name: Rebuild synthetic case and baseline
        run: |
          python examples/synthetic-case/generate_data.py --output /tmp/synthetic-case/subscriber_retention.csv
          python examples/synthetic-case/teacher/baseline.py \
            --data /tmp/synthetic-case/subscriber_retention.csv \
            --output-dir /tmp/synthetic-case/baseline \
            --check-range
      - name: Test synthetic case
        run: python -m unittest discover -s examples/synthetic-case/tests -v
